<div class="login-page">
  <!-- LEFT SIDE -->

  <div class="login-left">
    <div class="overlay"></div>

    <div class="login-brand">
      <div class="brand-icon">
        <img src="/content/images/library-icon.png" alt="Library Logo" />
      </div>

      <h1 jhiTranslate="login.title">LibraryHub</h1>

      <p jhiTranslate="login.subtitle">Manage your library, organize books and make borrowing easier than ever.</p>
    </div>
  </div>

  <!-- RIGHT SIDE -->

  <div class="login-right">
    <div class="login-card">
      <h2 jhiTranslate="login.form.title">Welcome Back</h2>

      <p class="subtitle" jhiTranslate="login.form.subtitle">Sign in to continue</p>

      @if (authenticationError()) {
        <div class="alert alert-danger" data-cy="loginError" jhiTranslate="login.messages.error.authentication">Failed to sign in!</div>
      }

      <form class="login-form" (ngSubmit)="login()" [formGroup]="loginForm">
        <!-- USERNAME -->

        <div class="input-group-custom">
          <label for="username" jhiTranslate="global.form.username.label"> Username </label>

          <div class="input-wrapper">
            <i class="bi bi-person"></i>

            <input
              id="username"
              type="text"
              class="form-control"
              formControlName="username"
              name="username"
              placeholder="{{ 'global.form.username.placeholder' | translate }}"
              data-cy="username"
            />
          </div>
        </div>

        <!-- PASSWORD -->

        <div class="input-group-custom">
          <label for="password" jhiTranslate="login.form.password"> Password </label>

          <div class="input-wrapper">
            <i class="bi bi-lock"></i>

            <input
              id="password"
              type="password"
              class="form-control"
              formControlName="password"
              name="password"
              placeholder="{{ 'login.form.password.placeholder' | translate }}"
              data-cy="password"
            />
          </div>
        </div>

        <!-- REMEMBER -->

        <div class="remember-row">
          <div class="form-check">
            <input class="form-check-input" id="rememberMe" type="checkbox" formControlName="rememberMe" />

            <label class="form-check-label" for="rememberMe">
              <span jhiTranslate="login.form.rememberme"> Remember me </span>
            </label>
          </div>
        </div>

        <!-- BUTTON -->

        <button type="submit" class="btn btn-login" data-cy="submit" jhiTranslate="login.form.button">Sign in</button>
      </form>

      <div class="login-links">
        <a routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector" jhiTranslate="login.password.forgot">
          Forgot password?
        </a>

        <p>
          <span jhiTranslate="global.messages.info.register.noaccount"> Don't have an account? </span>
        </p>

        <a routerLink="/account/register" jhiTranslate="global.messages.info.register.link"> Create account </a>
      </div>
    </div>
  </div>
</div>
